<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Entegro Health's Team Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23004f59'/%3E%3Crect x='6' y='8' width='5' height='16' rx='2' fill='%23a4d65e'/%3E%3Crect x='13.5' y='8' width='5' height='11' rx='2' fill='%23bbdde6'/%3E%3Crect x='21' y='8' width='5' height='7' rx='2' fill='%23a9b99e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky toolbar + blocker summary, five status columns that scroll sideways on phones, edit panel slides in from the right */
:root{
  --bg:#eef3f2; --surface:#ffffff; --sunk:#e3ebe9; --line:#d3dfdc; --fg:#10302f; --muted:#587270;
  --accent:#004f59; --accent-fg:#ffffff; --accent-soft:#d8ecef;
  --s-queue:#8a9a7f; --s-ready:#4298b5; --s-progress:#00737f; --s-blocked:#c0602a; --s-complete:#5f9a2a;
  --blocked-soft:#f8e6da; --danger:#b3261e; --shadow:0 1px 2px rgba(16,48,47,.08),0 4px 14px rgba(16,48,47,.06);
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1a1b; --surface:#132628; --sunk:#0f2022; --line:#24393b; --fg:#e2eeec; --muted:#8fa7a4;
  --accent:#5fb6c2; --accent-fg:#06282c; --accent-soft:#163a3f;
  --s-queue:#a9b99e; --s-ready:#6db6d1; --s-progress:#4fc0c9; --s-blocked:#e48a52; --s-complete:#a4d65e;
  --blocked-soft:#3a2518; --danger:#f2867e; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1a1b; --surface:#132628; --sunk:#0f2022; --line:#24393b; --fg:#e2eeec; --muted:#8fa7a4;
  --accent:#5fb6c2; --accent-fg:#06282c; --accent-soft:#163a3f;
  --s-queue:#a9b99e; --s-ready:#6db6d1; --s-progress:#4fc0c9; --s-blocked:#e48a52; --s-complete:#a4d65e;
  --blocked-soft:#3a2518; --danger:#f2867e; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-inline:16px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px}
.top-row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font:700 1.2rem/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
.brand .count{font:500 .78rem var(--f-mono);color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inp{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
#q{width:190px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);border-color:var(--line)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.summary{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:10px;font-size:.85rem}
.summary .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;font-weight:600;white-space:nowrap}
.chip.blk{background:var(--blocked-soft);border-color:transparent;color:var(--s-blocked)}
.chip.on{outline:2px solid var(--s-blocked)}
.chip .n{font-family:var(--f-mono);font-weight:500}
button.chip{cursor:pointer}

.notice{margin:10px 0 0;padding:8px 12px;border-radius:8px;background:var(--accent-soft);font-size:.88rem}

main.board{flex:1;min-height:0;overflow-x:auto;padding-block:14px 24px}
.cols{display:grid;grid-template-columns:repeat(5,minmax(250px,1fr));gap:12px;min-width:min-content;align-items:start}
.col{background:var(--sunk);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 4px 4px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.col-h h2{font:600 .9rem var(--f-display);margin:0}
.col-h .n{font:500 .75rem var(--f-mono);color:var(--muted);margin-right:auto}
.col-h .add{border:0;background:transparent;color:var(--muted);font-size:1.2rem;line-height:1;padding:2px 6px;border-radius:6px}
.col-h .add:hover{background:var(--surface);color:var(--fg)}
.empty{color:var(--muted);font-size:.85rem;padding:10px 6px;text-align:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;cursor:pointer;box-shadow:var(--shadow);text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.card.dragging{opacity:.45}
.card .t{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.card .t.untitled{color:var(--muted);font-style:italic;font-weight:500}
.card .b{color:var(--muted);font-size:.84rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card.done .t{text-decoration:line-through;text-decoration-color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.78rem;color:var(--muted)}
.meta .sub,.meta .due{font-family:var(--f-mono);font-size:.74rem}
.meta .due.late{color:var(--danger)}
.who{display:inline-flex;align-items:center;gap:6px;margin-left:auto;min-width:0;color:var(--fg)}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.av{width:22px;height:22px;border-radius:50%;flex:none;object-fit:cover;display:inline-grid;place-items:center;font:600 .62rem var(--f-body);color:#fff}
.bar{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--s-complete)}

/* Edit panel */
.scrim{position:fixed;inset:0;background:rgba(6,20,22,.35);z-index:20}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.15);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h .crumb{font:500 .75rem var(--f-mono);color:var(--muted);margin-right:auto}
.panel-b{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
#f-title{font:600 1.25rem/1.3 var(--f-display);border:1px solid transparent;border-radius:8px;padding:6px 8px;margin:-6px -8px;background:transparent;width:calc(100% + 16px);resize:none}
#f-title:hover{border-color:var(--line)}
#f-title:focus{border-color:var(--accent);outline:none;background:var(--bg)}
.fields{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;align-items:center}
.fields > label,.flabel{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.statuses{display:flex;flex-wrap:wrap;gap:6px}
.st{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:.82rem;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.st[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.blockrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.blockrow select{max-width:100%}
.picker-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:5px 10px;max-width:100%}
.picker-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#f-body{width:100%;min-height:140px;resize:vertical;line-height:1.5}
.subs{display:flex;flex-direction:column;gap:4px}
.subrow{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:8px}
.subrow:hover{background:var(--bg)}
.subrow input[type=checkbox]{width:17px;height:17px;accent-color:var(--s-complete);flex:none}
.subrow .stext{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px}
.subrow .stext:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.subrow.done .stext{text-decoration:line-through;color:var(--muted)}
.subrow .mini{border:0;background:transparent;padding:2px;border-radius:50%;display:inline-flex}
.subrow .x{border:0;background:transparent;color:var(--muted);padding:2px 6px;border-radius:6px;font-size:1rem}
.subrow .x:hover{color:var(--danger)}
.addsub{display:flex;gap:8px}
.addsub input{flex:1}
.footmeta{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--blocked-soft);padding:8px 10px;border-radius:8px;font-size:.88rem}

/* People picker */
.pop{position:fixed;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);width:min(300px,calc(100vw - 32px));padding:8px;display:flex;flex-direction:column;gap:6px}
.pop input{width:100%}
.pop ul{list-style:none;margin:0;padding:0;max-height:260px;overflow-y:auto;display:flex;flex-direction:column}
.pop li button{width:100%;display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:6px 8px;border-radius:6px;text-align:left}
.pop li button:hover,.pop li button:focus-visible{background:var(--accent-soft)}
.pop .hint{font-size:.78rem;color:var(--muted);padding:2px 8px}

/* Weeks + types */
.weekbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.wk-nav{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;min-width:0}
.wk-nav button{border:0;background:transparent;padding:6px 11px;font-weight:600;color:var(--muted)}
.wk-nav button:hover{color:var(--fg);background:var(--sunk)}
.wk-nav select{border:0;border-inline:1px solid var(--line);background:transparent;padding:6px 8px;font:600 .9rem var(--f-display);min-width:0;max-width:62vw}
.wk-tag{font:500 .72rem var(--f-mono);color:var(--muted);padding:2px 7px;border-radius:6px;background:var(--sunk)}
.carry{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding:8px 12px;border-radius:8px;background:var(--accent-soft);font-size:.88rem}
.type{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;letter-spacing:.02em;color:var(--fg);padding:2px 8px 2px 6px;border-radius:6px;background:var(--sunk);align-self:flex-start}
.type i{width:8px;height:8px;border-radius:2px;flex:none}
.types{display:flex;flex-wrap:wrap;gap:6px}
.tp{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;font-size:.82rem;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.tp i{width:9px;height:9px;border-radius:2px}
.tp[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.wkfield{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wkfield .cur{font:600 .9rem var(--f-display);padding:0 4px}
.wkfield .inp{padding:5px 8px}

/* Attachments */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.file{border:1px solid var(--line);border-radius:8px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.file .thumb{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--sunk);border:0;padding:0;cursor:zoom-in}
.file .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.file .doc{aspect-ratio:4/3;display:grid;place-items:center;background:var(--sunk);font:600 .85rem var(--f-mono);color:var(--muted)}
.file .fn{font-size:.78rem;padding:6px 8px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .fs{font:500 .68rem var(--f-mono);color:var(--muted);padding:0 8px}
.file .fa{display:flex;gap:2px;padding:4px}
.file .fa button,.file .fa a{border:0;background:transparent;font-size:.74rem;font-weight:600;color:var(--accent);padding:3px 6px;border-radius:5px;text-decoration:none}
.file .fa button:hover,.file .fa a:hover{background:var(--accent-soft)}
.file .fa .rm{color:var(--muted);margin-left:auto}
.file.link .doc{font-size:1.1rem}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;color:var(--muted);font-size:.85rem;margin-top:8px}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.linkform{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.linkform input{flex:1 1 160px}
.lightbox{position:fixed;inset:0;z-index:35;background:rgba(4,12,13,.86);display:grid;place-items:center;padding:24px 16px}
.lightbox img,.lightbox video{max-width:100%;max-height:calc(100vh - 110px);border-radius:8px;background:#000}
.lightbox .lb-bar{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px;display:flex;gap:8px}

/* Team roster */
.tform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tform .full{grid-column:1/-1}
.tform label{display:flex;flex-direction:column;gap:4px;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.tform input{text-transform:none;letter-spacing:0;font-size:.95rem;color:var(--fg);font-weight:400}
.err{color:var(--danger);font-size:.85rem;margin:0}
.roster{display:flex;flex-direction:column}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mrow .av{width:32px;height:32px;font-size:.75rem}
.mrow .mi{flex:1;min-width:0}
.mrow .mi b{display:block;font-weight:600}
.mrow .mi span{display:block;color:var(--muted);font-size:.84rem;overflow-wrap:anywhere}
.mrow .you{font:500 .68rem var(--f-mono);color:var(--accent);margin-left:6px}
.pop li small{display:block;color:var(--muted);font-size:.74rem}
.pop li .pl{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.tform{grid-template-columns:1fr}}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.88rem;z-index:40;max-width:calc(100vw - 32px)}

@media (max-width:640px){
  #q{width:100%;flex:1}
  .tools{width:100%}
  .fields{grid-template-columns:1fr;gap:6px}
  .fields > label{margin-top:6px}
  .cols{grid-template-columns:repeat(5,minmax(78vw,1fr))}
}
@media (prefers-reduced-motion:no-preference){
  .panel{animation:slide .18s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
}

/* standalone-site additions */
html,body{margin:0}
[hidden]{display:none!important}
#app{display:flex;flex-direction:column;min-height:100%;height:100%}
.who-me{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.who-me b{color:var(--fg);font-weight:600}
.mono{font-family:var(--f-mono);font-size:.78rem}
.meter{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px}
.meter-l{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.meter-l .mono{text-transform:none;letter-spacing:0}
.bar.big{height:8px;border-radius:4px}
.tform label.check{flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:.9rem;color:var(--fg);font-weight:500}
.tform label.check input{width:17px;height:17px;accent-color:var(--accent)}

#gate{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:
  radial-gradient(1200px 500px at 85% -10%,var(--accent-soft),transparent 60%),var(--bg)}
.gate-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;box-shadow:var(--shadow)}
.gate-card .mark{display:flex;gap:4px;margin-bottom:18px}
.gate-card .mark i{width:22px;height:6px;border-radius:3px}
.gate-card h1{font:700 1.35rem/1.2 var(--f-display);margin:0 0 8px;letter-spacing:-.01em;text-wrap:balance}
.gate-card p{color:var(--muted);margin:0 0 16px;line-height:1.5}
.gate-card p b{color:var(--fg)}
.g-form{display:flex;flex-direction:column;gap:10px}
.g-form .inp{padding:10px 12px;font-size:1rem}
.g-form .btn{padding:10px 14px}

.panel-b > *{flex-shrink:0}
.mrow .mi b .you{display:inline}
@media (max-width:640px){#q{flex:1 1 100%}}
.createbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;width:100%;padding:12px;border-radius:10px;background:var(--accent-soft)}
.createbar span{font-size:.88rem;color:var(--fg)}
#f-foot{position:sticky;bottom:0;background:var(--surface)}
.btn.flourish{padding:9px 22px;font-family:var(--f-display);letter-spacing:.02em}

/* ==================================================================
   "Garden party" theme: soft brand-tinted canvas, each status column
   wears its own pastel, chunky rounded controls, playful details.
   Status colors: Queue gray · Ready blue · In progress yellow ·
                  Blocked red · Complete green
   ================================================================== */
:root{
  --f-display:"Bricolage Grotesque","Figtree",ui-sans-serif,system-ui,sans-serif;
  --bg:#f4f7f2; --surface:#ffffff; --sunk:#eef2ec; --line:#dfe6dc; --fg:#17302e; --muted:#5e716d;
  --accent:#004f59; --accent-fg:#ffffff; --accent-soft:#dff0ee; --lime:#a4d65e; --lime-ink:#1f3a10; --sky:#bbdde6;
  /* status: strong (dots, pills) / tint (column) / ink (text on tint) */
  --s-queue:#8a94a3;    --t-queue:#eef0f4;    --i-queue:#3d4552;
  --s-ready:#3b8fe0;    --t-ready:#e5f0fd;    --i-ready:#1d4f84;
  --s-progress:#f2b81c; --t-progress:#fff5d4; --i-progress:#6b4d00;
  --s-blocked:#e5534b;  --t-blocked:#fde7e5;  --i-blocked:#8c231d;
  --s-complete:#3fa860; --t-complete:#e2f5e7; --i-complete:#1e5e31;
  --blocked-soft:#fde7e5; --danger:#c8352d;
  --shadow:0 1px 1px rgba(23,48,46,.04),0 4px 14px -4px rgba(23,48,46,.12);
  --shadow-lift:0 2px 3px rgba(23,48,46,.06),0 14px 28px -10px rgba(23,48,46,.25);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a1b; --surface:#172527; --sunk:#132022; --line:#263a3c; --fg:#e4efec; --muted:#93a8a4;
  --accent:#6cc2cd; --accent-fg:#062a2e; --accent-soft:#183a3e; --lime:#b6e27a; --lime-ink:#1a300c; --sky:#2b4a52;

  if(d<45)return 'just now';if(d<3600)return Math.round(d/60)+' min ago';if(d<86400)return Math.round(d/3600)+' h ago';
  if(d<7*86400)return Math.round(d/86400)+' d ago';
  return new Date(v).toLocaleDateString(undefined,{month:'short',day:'numeric'});}
async function postComment(taskId){
  const el=$('#f-cmt');if(!el||postingComment)return;const body=el.value.trim();if(!body)return;
  if(!commentsOk){toast('Comments need a one-time database update first.');return;}
  if(body.length>5000){toast('That comment is too long. Keep it under 5,000 characters.');return;}
  postingComment=true;const btn=$('#f-cmtpost');if(btn){btn.disabled=true;btn.textContent='Posting…';}
  const row={id:uid(),task_id:taskId,author:me.id,body};
  const {error}=await sb.from('task_comments').insert(row);
  postingComment=false;if(btn){btn.disabled=false;btn.textContent='Post comment';}
  if(error){handleErr(error);return;}
  if(!comments.some(c=>c.id===row.id))comments.push(Object.assign({created_at:new Date().toISOString(),edited_at:null},row));
  el.value='';el.style.height='';render();if(openId===taskId)syncPanel();
  const list=$('#f-cmts');if(list&&list.lastElementChild)list.lastElementChild.scrollIntoView({block:'nearest'});}
async function saveCommentEdit(c){
  const el=$('#cmt-edit-'+c.id);const body=el?el.value.trim():'';if(!body)return;
  const edited=new Date().toISOString();
  const {error}=await sb.from('task_comments').update({body,edited_at:edited}).eq('id',c.id);
  if(error){handleErr(error);return;}
  Object.assign(c,{body,edited_at:edited});editingComment=null;syncPanel();}
async function deleteComment(c){
  deletingComment=null;const {error}=await sb.from('task_comments').delete().eq('id',c.id);
  if(error){handleErr(error);return;}

function syncComments(t){

  if(!commentsOk){box.replaceChildren(h('p',{class:'cmt-empty',text:'Comments aren’t switched on yet. An admin needs to run the comments database update (migration-03).'}));return;}
  if(!list.length){box.replaceChildren(h('p',{class:'cmt-empty',text:'No comments yet. Hit a snag or have an update? Leave the first one.'}));return;}
  box.replaceChildren(...list.map(c=>{

    }else bodyEl=h('div',{class:'cmt-body',text:c.body});
    const actions=deletingComment===c.id
      ?h('span',{class:'cmt-act'},h('span',{text:'Delete?'}),h('button',{class:'danger',text:'Yes',onclick:()=>deleteComment(c)}),h('button',{text:'No',onclick:()=>{deletingComment=null;syncPanel();}}))
      :(editingComment===c.id?null:h('span',{class:'cmt-act'},
          mine?h('button',{text:'Edit',onclick:()=>{editingComment=c.id;deletingComment=null;syncPanel();}}):null,

      h('div',{class:'cmt-b'},
        h('div',{class:'cmt-h'},h('b',{text:c.author?aname(c.author):'Former member'}),

        bodyEl));}));}

function readMemberForm(prefix,excludeId){

  if(!EMAIL_RE.test(email))return {err:'Enter a valid email address.'};
  if(members.some(m=>m.id!==excludeId&&m.email.toLowerCase()===email))return {err:'That email is already on the team.'};
  return {data:{name,email,nickname:nickname||name.split(/\s+/)[0],is_admin:admin}};}

    h('div',{class:'panel-h'},h('span',{class:'crumb',id:'team-count'}),h('button',{class:'btn ghost',text:'Close',onclick:closeTeam})),
    h('div',{class:'panel-b'},
      h('div',null,h('h2',{style:'font:600 1.15rem var(--f-display);margin:0 0 4px',text:'Team members'}),
        h('p',{style:'margin:0;color:var(--muted);font-size:.88rem',text:'Only people on this list can sign in to the board. Tasks and subtasks can be assigned to anyone here.'})),
      form,h('div',{class:'roster',id:'team-list'}),meter));
  $('#layer').replaceChildren(h('div',{class:'scrim',onclick:closeTeam}),panel);
  renderTeamList();}
function renderTeamList(){
  const box=$('#team-list');if(!box)return;
  if(box.contains(document.activeElement)&&editingMember)return;
  $('#team-count').textContent=`${members.length} ${members.length===1?'MEMBER':'MEMBERS'}`;
  const sorted=members.slice().sort((a,b)=>(a.nickname||a.name).localeCompare(b.nickname||b.name));
  const openCount=id=>tasks.filter(t=>t.status!=='complete'&&t.assignee===id).length;
  box.replaceChildren(...sorted.map(m=>{
    if(editingMember===m.id){
      const e2=h('p',{class:'err',hidden:true});
      const save=async()=>{const r=readMemberForm('e',m.id);if(r.err){e2.textContent=r.err;e2.hidden=false;return;}
        if(m.id===me.id&&!r.data.is_admin){e2.textContent='You can’t remove your own admin access.';e2.hidden=false;return;}
        const {error}=await sb.from('team_members').update(r.data).eq('id',m.id);
        if(error){e2.textContent='Couldn’t save. Only admins can change the team.';e2.hidden=false;return;}
        editingMember=null;await loadMembers();};
      return h('div',{class:'mrow'},h('div',{class:'tform',style:'flex:1'},
        h('label',null,'Full name',h('input',{class:'inp',id:'e-name',value:m.name})),
        h('label',null,'Nickname',h('input',{class:'inp',id:'e-nick',value:m.nickname||''})),
        h('label',{class:'full'},'Email',h('input',{class:'inp',id:'e-email',type:'email',value:m.email})),
        h('label',{class:'check full'},h('input',{type:'checkbox',id:'e-admin',checked:m.is_admin}),'Admin'),
        h('div',{class:'full',style:'display:flex;gap:8px;flex-wrap:wrap;align-items:center'},h('button',{class:'btn primary',text:'Save',onclick:save}),
          h('button',{class:'btn ghost',text:'Cancel',onclick:()=>{editingMember=null;renderTeamList();}}),e2)));}
    const n=openCount(m.id);
    const actions=!isAdmin?null:removingMember===m.id
      ?h('div',{class:'confirm'},n?`${n} open ${n===1?'task becomes':'tasks become'} unassigned. Remove ${m.nickname||m.name}?`:`Remove ${m.nickname||m.name} from the team?`,
          h('button',{class:'btn danger',text:'Remove',onclick:async()=>{removingMember=null;const {error}=await sb.from('team_members').delete().eq('id',m.id);if(error)handleErr(error);await loadMembers();await loadAll();}}),
          h('button',{class:'btn ghost',text:'Cancel',onclick:()=>{removingMember=null;renderTeamList();}}))
      :h('div',{style:'display:flex;gap:4px'},h('button',{class:'btn ghost',text:'Edit',onclick:()=>{editingMember=m.id;renderTeamList();setTimeout(()=>$('#e-name')&&$('#e-name').focus());}}),
          m.id===me.id?null:h('button',{class:'btn ghost danger',text:'Remove',onclick:()=>{removingMember=m.id;renderTeamList();}}));
    return h('div',{class:'mrow'},avatar(m.id),
      h('div',{class:'mi'},h('b',null,m.nickname||m.name,m.id===me.id?h('span',{class:'you',text:'YOU'}):null,m.is_admin?h('span',{class:'you',text:'ADMIN'}):null),
        h('span',{text:`${m.name} · ${m.email}`}),h('span',{text:n?`${n} open ${n===1?'task':'tasks'}`:'No open tasks'})),actions);}));}

/* ---------- data loading + live updates ---------- */
async function loadMembers(){
  const {data,error}=await sb.from('team_members').select('*').order('name');
  if(error){handleErr(error);return;}
  members=data;const mine=members.find(m=>m.id===me.id);if(mine){me=mine;isAdmin=!!mine.is_admin;}
  $('#team').textContent=`Team (${members.length})`;
  render();if(openId)syncPanel();if(teamOpen)renderTeamList();}
async function loadAll(){
  const [t,b]=await Promise.all([sb.from('tasks').select('*'),sb.from('blockers').select('*').order('sort')]);
  if(t.error||b.error){handleErr(t.error||b.error);return;}
  tasks=t.data;blockerList=b.data;loaded=true;
  const c=await sb.from('task_comments').select('*').order('created_at');
  if(c.error){commentsOk=false;comments=[];console.warn('Comments unavailable:',c.error.message);}else{commentsOk=true;comments=c.data;}
  await loadMembers();}
function applyChange(list,p){
  if(p.eventType==='DELETE'){const id=p.old&&p.old.id;return list.filter(x=>x.id!==id);}
  const row=p.new;const i=list.findIndex(x=>x.id===row.id);
  if(i<0)return list.concat([row]);const copy=list.slice();copy[i]=row;return copy;}
let channel=null;
function subscribe(){
  if(channel)sb.removeChannel(channel);
  channel=sb.channel('board')
    .on('postgres_changes',{event:'*',schema:'public',table:'tasks'},p=>{
      // ignore the echo of our own edit while more local edits are still queued
      tasks=applyChange(tasks,p);render();if(openId)syncPanel();if(teamOpen)renderTeamList();})
    .on('postgres_changes',{event:'*',schema:'public',table:'team_members'},()=>loadMembers())
    .on('postgres_changes',{event:'*',schema:'public',table:'task_comments'},p=>{comments=applyChange(comments,p);render();if(openId)syncPanel();})
    .on('postgres_changes',{event:'*',schema:'public',table:'blockers'},p=>{blockerList=applyChange(blockerList,p).sort((a,b)=>a.sort-b.sort);render();if(openId)syncPanel();})
    .subscribe();}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return;}
  if(me&&hiddenAt&&Date.now()-hiddenAt>60000){loadAll();subscribe();}});

/* ---------- sign-in ---------- */
function showGate(mode,detail){
  $('#app').hidden=true;$('#gate').hidden=false;
  const box=$('#gate-body');
  if(mode==='setup'){box.replaceChildren(
    h('h1',{text:'Almost ready'}),
    h('p',{text:'This board isn’t connected to its database yet. Paste the Supabase project URL and anon key into the connection settings at the top of the script in index.html.'}));return;}
  if(mode==='notmember'){box.replaceChildren(
    h('h1',{text:'Not on the team list'}),
    h('p',null,'You signed in as ',h('b',{text:detail||'this email'}),', which isn’t on the Entegro team list. Ask an admin to add you, then sign in again.'),
    h('button',{class:'btn primary',text:'Use a different email',onclick:signOut}));return;}
  if(mode==='sent'){box.replaceChildren(
    h('h1',{text:'Check your email'}),
    h('p',null,'We sent a sign-in link to ',h('b',{text:detail}),'. Open it on this device to get in. It can take a minute to arrive; check spam too.'),
    h('button',{class:'btn ghost',text:'Use a different email',onclick:()=>showGate('signin')}));return;}
  const email=h('input',{class:'inp',id:'g-email',type:'email',autocomplete:'email',placeholder:'you@company.com','aria-label':'Email'});
  const msg=h('p',{class:'err',hidden:true});
  const btn=h('button',{class:'btn primary',type:'submit',text:'Email me a sign-in link'});
  const form=h('form',{class:'g-form',onsubmit:async e=>{e.preventDefault();
    const v=email.value.trim().toLowerCase();if(!EMAIL_RE.test(v)){msg.textContent='Enter a valid email address.';msg.hidden=false;return;}
    btn.disabled=true;msg.hidden=true;
    try{
      const chk=await sb.rpc('is_team_email',{check_email:v});
      if(chk.error)throw chk.error;
      if(!chk.data){msg.textContent='That email isn’t on the team list. Ask an admin to add you.';msg.hidden=false;return;}
      const {error}=await sb.auth.signInWithOtp({email:v,options:{emailRedirectTo:location.origin+location.pathname}});
      if(error)throw error;
      showGate('sent',v);
    }catch(err){msg.textContent=/rate|too many|seconds/i.test(err.message||'')?'Too many sign-in emails were sent recently. Wait a few minutes and try again.':'Couldn’t send the link. Check your connection and try again.';msg.hidden=false;console.error(err);}
    finally{btn.disabled=false;}}},email,btn,msg);
  box.replaceChildren(h('h1',{text:'Entegro Health\u2019s Team Board'}),h('p',{text:'Sign in with your work email. We’ll send you a link; no password needed.'}),form);
  setTimeout(()=>email.focus());}
async function signOut(){try{await sb.auth.signOut();}catch(e){}me=null;session=null;tasks=[];members=[];loaded=false;closePanel();showGate('signin');}
let entering=false;
async function enter(){
  if(entering||me)return;entering=true;
  const {data,error}=await sb.rpc('current_member');
  entering=false;
  if(error){console.error(error);showGate('signin');return;}
  const m=Array.isArray(data)?data[0]:data;
  if(!m||!m.id){showGate('notmember',session.user.email);return;}
  me=m;isAdmin=!!m.is_admin;
  $('#gate').hidden=true;$('#app').hidden=false;
  $('#me').textContent=m.nickname||m.name;
  render();await loadAll();subscribe();}

/* ---------- wiring ---------- */
$('#q').addEventListener('input',e=>{filter.q=e.target.value;render();});
$('#who').addEventListener('change',e=>{filter.who=e.target.value;render();});
$('#type').addEventListener('change',e=>{filter.type=e.target.value;render();});
$('#week').addEventListener('change',e=>{filter.week=e.target.value;filter.blocker=null;e.target.blur();render();});
const baseWk=()=>/^\d/.test(filter.week)?filter.week:wkId(new Date());
$('#wk-prev').addEventListener('click',()=>{filter.week=shiftWk(baseWk(),-1);render();});
$('#wk-next').addEventListener('click',()=>{filter.week=shiftWk(baseWk(),1);render();});
$('#wk-today').addEventListener('click',()=>{filter.week=wkId(new Date());render();});
$('#new').addEventListener('click',()=>createTask('queue'));
$('#team').addEventListener('click',openTeam);
$('#signout').addEventListener('click',signOut);
document.addEventListener('keydown',e=>{if(e.key!=='Escape'||pop||document.querySelector('.lightbox'))return;if(openId)requestClose();else if(teamOpen)closeTeam();});

async function start(){
  if(/^PASTE/.test(SUPABASE_URL)||/^PASTE/.test(SUPABASE_ANON_KEY)||!window.supabase){showGate('setup');return;}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev,s)=>{
    if(ev==='SIGNED_IN'&&s&&!me){session=s;enter();}
    else if(ev==='SIGNED_OUT'){me=null;}});
  const {data:{session:s}}=await sb.auth.getSession();
  if(s&&!me){session=s;enter();}else if(!s)showGate('signin');
  if(location.hash&&/access_token|error/.test(location.hash))history.replaceState(null,'',location.pathname+location.search);}
start();
})();

</script>
